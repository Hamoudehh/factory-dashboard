<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>בקרת ייצור מאפייה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
        <div>
          <h1 id="plant-name">מאפייה</h1>
          <p id="today-label"></p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="theme-btn" aria-label="מצב תצוגה"></button>
        <a class="icon-btn" id="settings-link" href="#settings" aria-label="הגדרות" title="הגדרות"></a>
      </div>
    </div>
    <div class="filters" id="filters">
      <div class="seg" id="period-seg" role="group" aria-label="תקופה"></div>
      <div class="custom-range" id="custom-range" hidden>
        <label for="from-date">מ-</label><input type="date" id="from-date">
        <label for="to-date">עד</label><input type="date" id="to-date">
      </div>
      <label for="machine-filter" class="sr-only">מכונה</label>
      <select id="machine-filter"></select>
    </div>
  </header>

  <nav class="tabs" aria-label="מסכים"><div class="tabs-inner" id="tabs-inner"></div></nav>

  <div class="banner" id="storage-banner" hidden>הדפדפן חוסם שמירה מקומית. הנתונים יימחקו כשתסגור את הדף. הורד גיבוי מההגדרות לפני שאתה יוצא.</div>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal-root"></div>

  <script src="js/config.js"></script>
  <script src="js/kpi.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
